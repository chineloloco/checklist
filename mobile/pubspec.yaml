name: checklist_mobile
description: Cliente móvel offline-first para checklists operacionais.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/template-catalog.json

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
