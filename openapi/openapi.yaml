components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token curto emitido por `/auth/login` ou `/auth/refresh`. O web usa sessão segura no
        BFF.
    webSession:
      type: apiKey
      in: cookie
      name: __Secure-checklist.session
      description: Sessão NextAuth em produção; no desenvolvimento o nome é checklist.session.
  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    WeeklyChecklistId:
      name: weeklyChecklistId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    InspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ConflictId:
      name: conflictId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID por intenção de mutação; o mesmo valor com payload diferente retorna 409.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag da revisão lida, por exemplo `"rev-3"`.
      schema:
        type: string
        pattern: ^"rev-[0-9]+"$
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        pattern: ^[0-9]+$
        example: "0"
      description: Sequência numérica em texto; a implementação atual não utiliza cursor opaco.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Requisição malformada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Token ausente, expirado ou inválido
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.example.com/problems/unauthorized
            title: Autenticação necessária
            status: 401
            code: UNAUTHORIZED
            detail: Obtenha um novo token e tente novamente.
            traceId: 01JTESTTRACE000000000000004
    Forbidden:
      description: Identidade autenticada sem permissão no escopo solicitado
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso inexistente ou fora do escopo da organização
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflito de estado, unicidade ou idempotência
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RevisionConflict:
      description: A revisão enviada ficou desatualizada
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://api.example.com/problems/revision-conflict
            title: O registro foi alterado em outro lugar
            status: 409
            code: REVISION_CONFLICT
            detail: Atualize o registro e faça uma resolução explícita.
            traceId: 01JTESTTRACE000000000000005
            currentRevision: 4
    ValidationFailed:
      description: Regras de domínio ou campos inválidos
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Uuid:
      type: string
      format: uuid
    TemplateStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - ARCHIVED
    TemplateVersionStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    AssetKind:
      type: string
      enum:
        - VEHICLE
        - EQUIPMENT
    LifecycleStatus:
      type: string
      enum:
        - DRAFT
        - COMPLETED
        - CORRECTED
        - VOIDED
    Result:
      type:
        - string
        - "null"
      enum:
        - C
        - NC
        - NA
        - null
    OwnershipType:
      type: string
      enum:
        - OWN
        - THIRD_PARTY
    Me:
      type: object
      additionalProperties: false
      required:
        - userId
        - organizationId
        - displayName
        - timezone
        - weekStartsOn
        - roles
        - permissions
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        organizationId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
        timezone:
          type: string
          example: America/Fortaleza
        weekStartsOn:
          type: string
          const: MONDAY
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    TemplateSummary:
      type: object
      required:
        - id
        - code
        - name
        - assetKind
        - status
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Z0-9_]+$
        name:
          type:
            - string
            - "null"
          maxLength: 200
        assetKind:
          $ref: "#/components/schemas/AssetKind"
        status:
          $ref: "#/components/schemas/TemplateStatus"
        identificationStatus:
          type: string
        latestVersion:
          type:
            - integer
            - "null"
        publishedVersions:
          type:
            - integer
            - string
    TemplateDetail:
      allOf:
        - $ref: "#/components/schemas/TemplateSummary"
        - type: object
          required:
            - versions
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/TemplateVersionSummary"
    TemplateVersionSummary:
      type: object
      required:
        - id
        - versionNumber
        - status
        - revision
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        versionNumber:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/TemplateVersionStatus"
        revision:
          type: integer
          minimum: 1
        checksum:
          type:
            - string
            - "null"
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        identificationFields:
          type: array
          items:
            type: string
    TemplateVersion:
      type: object
      required:
        - id
        - templateId
        - versionNumber
        - status
        - revision
        - sections
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        templateId:
          $ref: "#/components/schemas/Uuid"
        versionNumber:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/TemplateVersionStatus"
        revision:
          type: integer
          minimum: 1
        checksum:
          type:
            - string
            - "null"
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        publishedBy:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        template:
          $ref: "#/components/schemas/TemplateSummary"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSection"
        identificationFields:
          type: array
          items:
            type: string
    TemplateSection:
      type: object
      required:
        - id
        - versionId
        - title
        - sortOrder
        - items
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        versionId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          maxLength: 300
        sortOrder:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/TemplateItem"
    TemplateItem:
      type: object
      required:
        - id
        - sectionId
        - versionId
        - originalText
        - sortOrder
        - requiredOnComplete
        - requireObservationWhenNc
        - requirePhotoWhenNc
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        sectionId:
          $ref: "#/components/schemas/Uuid"
        versionId:
          $ref: "#/components/schemas/Uuid"
        sourcePrintedNumber:
          type:
            - string
            - "null"
          maxLength: 20
        originalText:
          type: string
        sortOrder:
          type: integer
        requiredOnComplete:
          type: boolean
        requireObservationWhenNc:
          type: boolean
        requirePhotoWhenNc:
          type: boolean
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - assetKind
        - identificationFields
        - sections
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Z0-9_]+$
        name:
          type:
            - string
            - "null"
          maxLength: 200
        assetKind:
          $ref: "#/components/schemas/AssetKind"
        sections:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/TemplateSectionInput"
        identificationFields:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 80
    UpdateTemplateVersionRequest:
      type: object
      required:
        - identificationFields
        - sections
      properties:
        identificationFields:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 80
        sections:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/TemplateSectionInput"
      description: >-
        A revisão base é obtida de If-Match; as posições das seções e itens são definidas pela ordem
        dos arrays.
    Asset:
      type: object
      required:
        - id
        - kind
        - code
        - revision
        - active
        - companyId
        - ownershipType
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        kind:
          $ref: "#/components/schemas/AssetKind"
        code:
          type: string
          minLength: 1
          maxLength: 100
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        siteId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        licensePlate:
          type:
            - string
            - "null"
          maxLength: 20
        makeModel:
          type:
            - string
            - "null"
          maxLength: 200
        manufacturer:
          type:
            - string
            - "null"
          maxLength: 200
        manufactureYear:
          type:
            - integer
            - "null"
          minimum: 1900
          maximum: 2200
        predominantColor:
          type:
            - string
            - "null"
          maxLength: 80
        ownershipType:
          $ref: "#/components/schemas/OwnershipType"
        companyId:
          $ref: "#/components/schemas/Uuid"
    OperationConfig:
      type: object
      required:
        - id
        - templateId
        - timezone
        - weekStartsOn
        - requiredWeekdays
        - maxOccurrencesPerDate
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        templateId:
          $ref: "#/components/schemas/Uuid"
        timezone:
          type: string
        weekStartsOn:
          type: string
          const: MONDAY
        requiredWeekdays:
          type: array
          items:
            type: string
            enum:
              - MONDAY
              - TUESDAY
              - WEDNESDAY
              - THURSDAY
              - FRIDAY
              - SATURDAY
              - SUNDAY
        maxOccurrencesPerDate:
          type: integer
          minimum: 1
          maximum: 20
    AssetTemplateAssignment:
      type: object
      required:
        - id
        - assetId
        - templateId
        - operationConfigId
        - active
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        assetId:
          $ref: "#/components/schemas/Uuid"
        templateId:
          $ref: "#/components/schemas/Uuid"
        operationConfigId:
          $ref: "#/components/schemas/Uuid"
        active:
          type: boolean
    WeeklyChecklist:
      type: object
      required:
        - id
        - assetId
        - templateId
        - templateVersionId
        - operationConfigId
        - weekStartDate
        - timezone
        - revision
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        assetId:
          $ref: "#/components/schemas/Uuid"
        templateId:
          $ref: "#/components/schemas/Uuid"
        templateVersionId:
          $ref: "#/components/schemas/Uuid"
        operationConfigId:
          $ref: "#/components/schemas/Uuid"
        weekStartDate:
          type: string
          format: date
        timezone:
          type: string
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    WeeklyChecklistDetail:
      allOf:
        - $ref: "#/components/schemas/WeeklyChecklist"
        - type: object
          required:
            - inspections
          properties:
            inspections:
              type: array
              items:
                $ref: "#/components/schemas/InspectionSummary"
    IdentificationSnapshot:
      type: object
      additionalProperties: true
      required:
        - company
        - site
        - assetCode
        - ownershipType
        - responsiblePersonName
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 200
        site:
          type: string
          minLength: 1
          maxLength: 200
        manufactureYear:
          type:
            - integer
            - "null"
          minimum: 1900
          maximum: 2200
        predominantColor:
          type:
            - string
            - "null"
          maxLength: 80
        assetCode:
          type: string
          minLength: 1
          maxLength: 100
        ownershipType:
          $ref: "#/components/schemas/OwnershipType"
        licensePlate:
          type:
            - string
            - "null"
          maxLength: 20
        vehicleMakeModel:
          type:
            - string
            - "null"
          maxLength: 200
        manufacturer:
          type:
            - string
            - "null"
          maxLength: 200
        responsiblePersonId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        responsiblePersonName:
          type: string
          minLength: 1
          maxLength: 200
        driverLicenseNumber:
          type:
            - string
            - "null"
          maxLength: 30
        driverLicenseExpiryDate:
          type:
            - string
            - "null"
          format: date
        moppExpiryDate:
          type:
            - string
            - "null"
          format: date
        passengerTransportCourseExpiryDate:
          type:
            - string
            - "null"
          format: date
    InspectionResponse:
      type: object
      additionalProperties: false
      required:
        - itemId
        - result
      properties:
        itemId:
          $ref: "#/components/schemas/Uuid"
        result:
          $ref: "#/components/schemas/Result"
        observation:
          type:
            - string
            - "null"
          maxLength: 4000
    CreateInspectionRequest:
      type: object
      additionalProperties: false
      required:
        - clientInspectionId
        - deviceId
        - localDate
        - lifecycleStatus
        - identification
        - responses
      properties:
        clientInspectionId:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          type: string
          minLength: 1
          maxLength: 100
        localDate:
          type: string
          format: date
        occurrenceNo:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        lifecycleStatus:
          type: string
          enum:
            - DRAFT
            - COMPLETED
        identification:
          $ref: "#/components/schemas/IdentificationSnapshot"
        observations:
          type:
            - string
            - "null"
          maxLength: 10000
        responses:
          type: array
          items:
            $ref: "#/components/schemas/InspectionResponse"
          maxItems: 500
        attachments:
          type: array
          maxItems: 5
          default: []
          items:
            $ref: "#/components/schemas/InspectionAttachment"
        operationId:
          $ref: "#/components/schemas/Uuid"
    UpdateInspectionRequest:
      type: object
      additionalProperties: false
      properties:
        identification:
          $ref: "#/components/schemas/IdentificationSnapshot"
        observations:
          type:
            - string
            - "null"
          maxLength: 10000
        responses:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/InspectionResponse"
        lifecycleStatus:
          type: string
          enum:
            - DRAFT
            - COMPLETED
            - CORRECTED
        correctionReason:
          type: string
          minLength: 3
          maxLength: 1000
        operationId:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          type: string
          minLength: 1
          maxLength: 100
        attachments:
          type: array
          maxItems: 5
          default: []
          items:
            $ref: "#/components/schemas/InspectionAttachment"
      required:
        - identification
        - responses
      description: >-
        baseRevision é obtida do cabeçalho If-Match na rota HTTP e de baseRevision na operação de
        sync.
    InspectionSummary:
      type: object
      required:
        - id
        - localDate
        - occurrenceNo
        - lifecycleStatus
        - revision
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        localDate:
          type: string
          format: date
        occurrenceNo:
          type: integer
          minimum: 1
        lifecycleStatus:
          $ref: "#/components/schemas/LifecycleStatus"
        revision:
          type: integer
          minimum: 1
    Inspection:
      allOf:
        - $ref: "#/components/schemas/InspectionSummary"
        - type: object
          required:
            - weeklyChecklistId
            - clientInspectionId
            - identification
            - responses
            - history
            - attachments
          properties:
            weeklyChecklistId:
              $ref: "#/components/schemas/Uuid"
            clientInspectionId:
              $ref: "#/components/schemas/Uuid"
            identification:
              $ref: "#/components/schemas/IdentificationSnapshot"
            observations:
              type:
                - string
                - "null"
            responses:
              type: array
              items:
                $ref: "#/components/schemas/InspectionResponse"
            attachments:
              type: array
              maxItems: 5
              default: []
              items:
                $ref: "#/components/schemas/InspectionAttachment"
            history:
              type: array
              items:
                $ref: "#/components/schemas/InspectionRevisionHistory"
            correctionReason:
              type:
                - string
                - "null"
              maxLength: 1000
    WeeklyView:
      type: object
      required:
        - weeklyChecklistId
        - weekStartDate
        - timezone
        - columns
        - sections
        - requiredSlots
        - asset
      properties:
        weeklyChecklistId:
          $ref: "#/components/schemas/Uuid"
        weekStartDate:
          type: string
          format: date
        timezone:
          type: string
        columns:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/InspectionSummary"
              - type: object
                required:
                  - required
                properties:
                  required:
                    type: boolean
                  conflict:
                    type: boolean
                  identification:
                    $ref: "#/components/schemas/IdentificationSnapshot"
                  observations:
                    type:
                      - string
                      - "null"
                  attachments:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - mediaType
                        - fileName
                      properties:
                        id:
                          $ref: "#/components/schemas/Uuid"
                        mediaType:
                          type: string
                        fileName:
                          type: string
        sections:
          type: array
          items:
            type: object
            required:
              - sectionId
              - title
              - items
            properties:
              sectionId:
                $ref: "#/components/schemas/Uuid"
              title:
                type: string
              items:
                type: array
                items:
                  type: object
                  required:
                    - itemId
                    - text
                    - cells
                  properties:
                    itemId:
                      $ref: "#/components/schemas/Uuid"
                    sourcePrintedNumber:
                      type:
                        - string
                        - "null"
                    text:
                      type: string
                    cells:
                      type: array
                      items:
                        type: object
                        required:
                          - inspectionId
                          - result
                        properties:
                          inspectionId:
                            $ref: "#/components/schemas/Uuid"
                          result:
                            $ref: "#/components/schemas/Result"
                          observation:
                            type:
                              - string
                              - "null"
        requiredSlots:
          type: array
          items:
            type: object
            required:
              - localDate
              - occurrenceNo
              - fulfilled
            properties:
              localDate:
                type: string
                format: date
              occurrenceNo:
                type: integer
                minimum: 1
              fulfilled:
                type: boolean
              uncertainty:
                type: string
        asset:
          type: object
          required:
            - code
            - templateName
            - site
            - company
          properties:
            code:
              type: string
            templateName:
              type:
                - string
                - "null"
            site:
              type:
                - string
                - "null"
            company:
              type: string
    MobileBootstrap:
      type: object
      required:
        - serverTime
        - cursor
        - timezone
        - weekStartsOn
        - templateVersions
        - assets
        - operationConfigs
        - assetTemplateAssignments
        - tombstones
        - companies
        - sites
        - people
      properties:
        serverTime:
          type: string
          format: date-time
        cursor:
          type: string
          pattern: ^[0-9]+$
          example: "0"
        timezone:
          type: string
        weekStartsOn:
          type: string
          const: MONDAY
        templateVersions:
          type: array
          items:
            $ref: "#/components/schemas/TemplateVersion"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        operationConfigs:
          type: array
          items:
            $ref: "#/components/schemas/OperationConfig"
        assetTemplateAssignments:
          type: array
          items:
            $ref: "#/components/schemas/AssetTemplateAssignment"
        tombstones:
          type: array
          items:
            $ref: "#/components/schemas/Tombstone"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        sites:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
      description: >-
        Catálogos ativos para operação offline. Não contém o histórico completo de semanas e
        inspeções de outros aparelhos.
    Tombstone:
      type: object
      required:
        - entityType
        - entityId
        - deletedAt
      properties:
        entityType:
          type: string
        entityId:
          $ref: "#/components/schemas/Uuid"
        deletedAt:
          type: string
          format: date-time
        changeType:
          type: string
          enum:
            - ARCHIVE
            - DELETE
    SyncOperation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - entityType
        - mutation
        - entityId
        - clientOccurredAt
        - payload
      properties:
        operationId:
          $ref: "#/components/schemas/Uuid"
        entityType:
          type: string
          enum:
            - COMPANY
            - SITE
            - PERSON
            - ASSET
            - WEEKLY_CHECKLIST
            - INSPECTION
            - AUDIT_EVENT
        mutation:
          type: string
          enum:
            - UPSERT
            - COMPLETE
            - VOID
        entityId:
          $ref: "#/components/schemas/Uuid"
        baseRevision:
          type:
            - integer
            - "null"
          minimum: 1
        clientOccurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
      description: >-
        Cadastros aceitam UPSERT sem revisão base. INSPECTION sem baseRevision cria; com
        baseRevision atualiza/conclui. AUDIT_EVENT aceita VOID apenas para registrar desativação
        local, com payload localDate e assetCode. Não anula inspeção já enviada.
    SyncPushRequest:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - operations
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 100
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncOperation"
    SyncOperationResult:
      type: object
      required:
        - operationId
        - status
        - entityId
      properties:
        operationId:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum:
            - APPLIED
            - ALREADY_APPLIED
            - CONFLICT
            - REJECTED
        entityId:
          $ref: "#/components/schemas/Uuid"
        serverRevision:
          type:
            - integer
            - "null"
        problem:
          type:
            - object
            - "null"
          additionalProperties: true
          properties:
            code:
              type: string
            detail:
              type: string
            conflictId:
              $ref: "#/components/schemas/Uuid"
          description: Problema resumido da operação; não exige todos os campos de Problem Details.
    SyncPushResponse:
      type: object
      required:
        - serverTime
        - results
      properties:
        serverTime:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncOperationResult"
    SyncPullResponse:
      type: object
      required:
        - serverTime
        - nextCursor
        - hasMore
        - changes
        - tombstones
      properties:
        serverTime:
          type: string
          format: date-time
        nextCursor:
          type: string
          pattern: ^[0-9]+$
          example: "0"
        hasMore:
          type: boolean
        changes:
          type: array
          items:
            type: object
            required:
              - entityType
              - entityId
              - revision
              - payload
            properties:
              entityType:
                type: string
              entityId:
                $ref: "#/components/schemas/Uuid"
              revision:
                type: integer
                minimum: 1
              payload:
                type: object
                additionalProperties: true
        tombstones:
          type: array
          items:
            $ref: "#/components/schemas/Tombstone"
    ConflictCase:
      type: object
      required:
        - id
        - type
        - status
        - revision
        - members
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          enum:
            - DUPLICATE_SLOT
            - REVISION_CONFLICT
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
        revision:
          type: integer
          minimum: 1
        members:
          type: array
          minItems: 2
          items:
            type: object
            required:
              - inspectionId
              - role
            properties:
              inspectionId:
                $ref: "#/components/schemas/Uuid"
              role:
                type: string
                enum:
                  - EXISTING
                  - CANDIDATE
                  - RESOLVED_PRIMARY
        differences:
          type: array
          items:
            type: object
            additionalProperties: true
        resolution:
          type:
            - string
            - "null"
          enum:
            - CHOOSE_PRIMARY
            - KEEP_SEPARATE
            - MERGE
            - null
        reason:
          type:
            - string
            - "null"
        resolvedBy:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        resolvedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
    ResolveConflictRequest:
      type: object
      additionalProperties: false
      required:
        - resolution
        - reason
      properties:
        resolution:
          type: string
          enum:
            - CHOOSE_PRIMARY
            - KEEP_SEPARATE
            - MERGE
        primaryInspectionId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        itemChoices:
          type: array
          items:
            type: object
            required:
              - itemId
              - sourceInspectionId
            properties:
              itemId:
                $ref: "#/components/schemas/Uuid"
              sourceInspectionId:
                $ref: "#/components/schemas/Uuid"
    JsonPatchOperation:
      type: object
      additionalProperties: false
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
        path:
          type: string
          pattern: ^/
        value: {}
    AuditEvent:
      type: object
      required:
        - id
        - entityType
        - entityId
        - action
        - actorUserId
        - occurredAt
        - changes
        - actorDisplayName
        - actorNamePreserved
        - metadata
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        entityType:
          type: string
        entityId:
          $ref: "#/components/schemas/Uuid"
        action:
          type: string
        actorUserId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        occurredAt:
          type: string
          format: date-time
        reason:
          type:
            - string
            - "null"
        changes:
          type: array
          items: {}
        actorDisplayName:
          type: string
          maxLength: 200
        actorNamePreserved:
          type: boolean
          description: false indica nome de cadastro atual ou sistema como fallback, sem snapshot histórico.
        metadata:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required:
        - pointer
        - code
        - message
      properties:
        pointer:
          type: string
          example: /responses/3/result
        code:
          type: string
          example: REQUIRED
        message:
          type: string
          example: Selecione C, NC ou NA.
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - detail
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    EmployeeNumber:
      type: string
      minLength: 1
      maxLength: 50
      pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$
      example: "001234"
      description: >-
        Matrícula em texto; espaços externos são removidos e letras normalizadas para maiúsculas.
        Preserva zeros iniciais. Única no banco.
    ManagedUser:
      type: object
      required:
