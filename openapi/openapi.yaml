openapi: 3.1.0
info:
  title: API de Checklists Operacionais
  version: 0.1.0
  license:
    name: Proprietary
  description: >-
    Contrato da plataforma web e do aplicativo Flutter. O login por senha usa matrícula. Datas
    locais usam o fuso fixado na semana; instantes são UTC. As limitações de sincronização estão em
    docs/mobile-contract-gaps.md.
servers:
  - url: /api/v1
    description: Mesmo host da aplicação web ou base URL configurada no aplicativo
tags:
  - name: Identity
    description: Identidade autenticada e permissões efetivas.
  - name: Templates
    description: Modelos, versões, publicação e arquivamento.
  - name: Mobile
    description: Bootstrap de dados para operação offline.
  - name: Assets
    description: Veículos, equipamentos e seus dados cadastrais.
  - name: Weekly checklists
    description: Contêiner semanal, configuração fixada e visão consolidada.
  - name: Inspections
    description: Preenchimentos independentes por data e suas correções.
  - name: Sync
    description: Push/pull idempotente entre Drift e o servidor.
  - name: Conflicts
    description: Detecção e resolução explícita de concorrência.
  - name: Audit
    description: Histórico imutável de alterações relevantes.
  - name: Users
    description: Contas de acesso; exige users:manage (ORG_ADMIN).
  - name: Registry
    description: Empresas, locais e pessoas; leitura cadastros:read, escrita cadastros:write.
security:
  - bearerAuth: []
  - webSession: []
paths:
  /auth/login:
    post:
      tags:
        - Identity
      operationId: mobilePasswordLogin
      summary: Inicia sessão móvel com matrícula e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeNumber
                - password
              properties:
                employeeNumber:
                  $ref: "#/components/schemas/EmployeeNumber"
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
                  format: password
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: Tokens e identidade; acesso de 15 minutos e refresh de 30 dias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /auth/refresh:
    post:
      tags:
        - Identity
      operationId: refreshMobileSession
      summary: Rotaciona o refresh token e emite um novo access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 32
                  maxLength: 500
                deviceId:
                  type: string
                  maxLength: 100
      responses:
        "200":
          description: Refresh rotacionado e novo access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags:
        - Identity
      operationId: logoutMobileSession
      summary: Revoga o refresh token móvel
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  minLength: 32
                  maxLength: 500
      responses:
        "204":
          description: Sessão encerrada
  /me:
    get:
      tags:
        - Identity
      operationId: getMe
      summary: Retorna identidade, organização e permissões efetivas
      responses:
        "200":
          description: Identidade autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                userId: 019aa111-1111-7111-8111-111111111111
                organizationId: 019aa222-2222-7222-8222-222222222222
                displayName: Ana Supervisor
                timezone: America/Fortaleza
                weekStartsOn: MONDAY
                roles:
                  - SUPERVISOR
                permissions:
                  - templates:read
                  - inspections:read
                  - inspections:correct
                  - conflicts:resolve
        "401":
          $ref: "#/components/responses/Unauthorized"
  /templates:
    get:
      tags:
        - Templates
      operationId: listTemplates
      summary: Lista modelos visíveis
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TemplateStatus"
      responses:
        "200":
          description: Página de modelos
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateSummary"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Templates
      operationId: createTemplate
      summary: Cria modelo com primeira versão em rascunho
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
            example:
              code: VL
              name: Veículos leves
              assetKind: VEHICLE
              identificationFields:
                - company
                - site
                - assetCode
                - responsiblePersonName
              sections:
                - title: Itens gerais
                  items:
                    - sourcePrintedNumber: "1"
                      text: Carteira de habilitação
      responses:
        "201":
          description: Modelo criado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags:
        - Templates
      operationId: getTemplate
      summary: Consulta modelo e versões
      responses:
        "200":
          description: Modelo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Templates
      operationId: deleteUnusedDraftTemplate
      summary: Exclui modelo somente quando todo o conteúdo é rascunho e não possui uso
      security:
        - bearerAuth: []
        - webSession: []
      responses:
        "204":
          description: Excluído
        "409":
          description: Modelo possui publicação ou referência e deve ser arquivado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.example.com/problems/template-has-history
                title: Modelo possui histórico
                status: 409
                code: TEMPLATE_HAS_HISTORY
                detail: Arquive o modelo em vez de excluí-lo.
                traceId: 01JTESTTRACE000000000000001
    patch:
      tags:
        - Templates
      operationId: updateTemplateMetadata
      summary: Confirma ou atualiza o nome do modelo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 200
      responses:
        "200":
          description: Modelo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /templates/{templateId}/versions:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      tags:
        - Templates
      operationId: createTemplateVersion
      summary: Cria nova versão em rascunho a partir de uma versão publicada
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - basedOnVersionId
              properties:
                basedOnVersionId:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "201":
          description: Versão em rascunho
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /template-versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    get:
      tags:
        - Templates
      operationId: getTemplateVersion
      summary: Consulta o conteúdo completo de uma versão
      responses:
        "200":
          description: Conteúdo completo e ordenado
          headers:
            ETag:
              schema:
                type: string
              example: '"rev-4"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Templates
      operationId: updateDraftTemplateVersion
      summary: Edita somente versão em rascunho
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateVersionRequest"
      responses:
        "200":
          description: Rascunho atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /template-versions/{versionId}/publish:
    post:
      tags:
        - Templates
      operationId: publishTemplateVersion
      summary: Publica e torna a versão imutável
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Versão publicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
              example:
                id: 019aa400-0000-7000-8000-000000000001
                templateId: 019aa400-0000-7000-8000-000000000002
                versionNumber: 1
                status: PUBLISHED
                revision: 5
                checksum: sha256:5c59d8f0example
                publishedAt: 2026-11-14T20:30:00.000Z
                publishedBy: 019aa111-1111-7111-8111-111111111111
                sections: []
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /templates/{templateId}/archive:
    post:
      tags:
        - Templates
      operationId: archiveTemplate
      summary: Impede novos usos sem remover histórico
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/TemplateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Modelo arquivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSummary"
        "409":
          $ref: "#/components/responses/Conflict"
  /mobile/bootstrap:
    get:
      tags:
        - Mobile
      operationId: getMobileBootstrap
      summary: Baixa manifesto e dados necessários ao trabalho offline
      parameters:
        - name: siteId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: sinceCursor
          in: query
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Manifesto incremental
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MobileBootstrap"
                  - $ref: "#/components/schemas/SyncPullResponse"
              example:
                serverTime: 2026-11-14T20:35:00.000Z
                cursor: org_42_00000125
                timezone: America/Fortaleza
                weekStartsOn: MONDAY
                templateVersions:
                  - id: 019aa400-0000-7000-8000-000000000001
                    templateId: 019aa400-0000-7000-8000-000000000002
                    versionNumber: 1
                    status: PUBLISHED
                    revision: 5
                    checksum: sha256:5c59d8f0example
                    publishedAt: 2026-11-14T20:30:00.000Z
                    publishedBy: 019aa111-1111-7111-8111-111111111111
                    sections: []
                assets: []
                operationConfigs: []
                tombstones: []
        "401":
          $ref: "#/components/responses/Unauthorized"
      description: >-
        Sem sinceCursor retorna o catálogo completo; com sinceCursor numérico não zero delega ao
        pull incremental.
  /assets:
    get:
      tags:
        - Assets
      operationId: listAssets
      summary: Lista ativos da organização
      description: Sem paginação ou filtros de consulta nesta rota.
      responses:
        "200":
          description: Cadastros
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssetListEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Assets
      operationId: createAsset
      summary: Cria cadastro Asset
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Cadastro criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /weekly-checklists:
    get:
      tags:
        - Weekly checklists
      operationId: listWeeklyChecklists
      summary: Lista checklists por ativo, modelo e semana
      parameters:
        - name: weekStartDate
          in: query
          schema:
            type: string
            format: date
        - name: assetId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: templateId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Checklists semanais
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WeeklyChecklistListEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Weekly checklists
      operationId: openWeeklyChecklist
      summary: Abre a semana e fixa versão/configuração
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetId
                - templateId
                - localDate
              properties:
                clientWeeklyChecklistId:
                  $ref: "#/components/schemas/Uuid"
                assetId:
                  $ref: "#/components/schemas/Uuid"
                templateId:
                  $ref: "#/components/schemas/Uuid"
                localDate:
                  type: string
                  format: date
                templateVersionId:
                  $ref: "#/components/schemas/Uuid"
                operationConfigId:
                  $ref: "#/components/schemas/Uuid"
              description: >-
                IDs opcionais permitem fixar versão/configuração baixadas pelo cliente. Retorna a
                semana existente para a mesma chave de negócio.
            example:
              clientWeeklyChecklistId: 019aa500-0000-7000-8000-000000000001
              assetId: 019aa500-0000-7000-8000-000000000002
              templateId: 019aa400-0000-7000-8000-000000000002
              localDate: 2026-11-10T00:00:00.000Z
      responses:
        "201":
          description: Checklist aberto; se já existir, idempotência retorna o mesmo recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyChecklist"
              example:
                id: 019aa500-0000-7000-8000-000000000001
                assetId: 019aa500-0000-7000-8000-000000000002
                templateId: 019aa400-0000-7000-8000-000000000002
                templateVersionId: 019aa400-0000-7000-8000-000000000001
                operationConfigId: 019aa500-0000-7000-8000-000000000003
                weekStartDate: 2026-11-09T00:00:00.000Z
                timezone: America/Fortaleza
                revision: 1
                createdAt: 2026-11-10T11:00:00.000Z
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /weekly-checklists/{weeklyChecklistId}:
    get:
      tags:
        - Weekly checklists
      operationId: getWeeklyChecklist
      summary: Consulta o checklist semanal e suas inspeções
      parameters:
        - $ref: "#/components/parameters/WeeklyChecklistId"
      responses:
        "200":
          description: Visão semanal consolidada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyView"
        "404":
          $ref: "#/components/responses/NotFound"
  /weekly-checklists/{weeklyChecklistId}/inspections:
    post:
      tags:
        - Inspections
      operationId: createInspection
      summary: Cria inspeção por data; preserva candidata em conflito de slot
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/WeeklyChecklistId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionRequest"
            example:
              clientInspectionId: 019aa600-0000-7000-8000-000000000001
              deviceId: flutter-7b9c0e
              localDate: 2026-11-10T00:00:00.000Z
              occurrenceNo: 1
              lifecycleStatus: DRAFT
              identification:
                company: Empresa Exemplo
                site: Pátio Norte
                manufactureYear: 2022
                predominantColor: Branco
                assetCode: VL-017
                ownershipType: OWN
                licensePlate: ABC1D23
                vehicleMakeModel: Marca Modelo
                responsiblePersonName: João da Silva
                driverLicenseNumber: "00000000000"
                driverLicenseExpiryDate: 2028-05-20T00:00:00.000Z
              responses:
                - itemId: 019aa600-0000-7000-8000-000000000010
                  result: C
                  observation: null
      responses:
        "201":
          description: Inspeção criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionMutationResult"
        "409":
          description: Conflito de slot ou idempotência incompatível; payload candidato foi preservado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.example.com/problems/duplicate-slot
                title: Outra inspeção ocupa o mesmo slot
                status: 409
                code: DUPLICATE_SLOT
                detail: As duas inspeções foram preservadas para resolução explícita.
                traceId: 01JTESTTRACE000000000000002
                conflictId: 019aa700-0000-7000-8000-000000000001
                existingInspectionId: 019aa600-0000-7000-8000-000000000099
                candidateInspectionId: 019aa600-0000-7000-8000-000000000001
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /weekly-checklists/{weeklyChecklistId}/view:
    get:
      tags:
        - Weekly checklists
      operationId: getWeeklyView
      summary: Retorna matriz semanal com itens em linhas e inspeções em colunas
      parameters:
        - $ref: "#/components/parameters/WeeklyChecklistId"
      responses:
        "200":
          description: Visão consolidada sem inferir pendência em dias não exigidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyView"
              example:
                weeklyChecklistId: 019aa500-0000-7000-8000-000000000001
                weekStartDate: 2026-11-09T00:00:00.000Z
                timezone: America/Fortaleza
                columns:
                  - inspectionId: 019aa600-0000-7000-8000-000000000001
                    id: 019aa600-0000-7000-8000-000000000001
                    localDate: 2026-11-10T00:00:00.000Z
                    occurrenceNo: 1
                    lifecycleStatus: COMPLETED
                    revision: 2
                    required: false
                  - inspectionId: 019aa600-0000-7000-8000-000000000002
                    id: 019aa600-0000-7000-8000-000000000002
                    localDate: 2026-11-12T00:00:00.000Z
                    occurrenceNo: 1
                    lifecycleStatus: DRAFT
                    revision: 1
                    required: false
                sections:
                  - sectionId: 019aa300-0000-7000-8000-000000000001
                    title: Itens gerais
                    items:
                      - itemId: 019aa600-0000-7000-8000-000000000010
                        sourcePrintedNumber: "1"
                        text: Carteira de habilitação
                        cells:
                          - inspectionId: 019aa600-0000-7000-8000-000000000001
                            result: C
                            observation: null
                          - inspectionId: 019aa600-0000-7000-8000-000000000002
                            result: NC
                            observation: Documento não apresentado
                requiredSlots: []
        "404":
          $ref: "#/components/responses/NotFound"
  /inspections/{inspectionId}:
    parameters:
      - $ref: "#/components/parameters/InspectionId"
    get:
      tags:
        - Inspections
      operationId: getInspection
      summary: Consulta a revisão atual de uma inspeção
      responses:
        "200":
          description: Inspeção atual
          headers:
            ETag:
              schema:
                type: string
              example: '"rev-3"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Inspections
      operationId: updateDraftInspection
      summary: Atualiza rascunho com concorrência otimista
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionRequest"
      responses:
        "200":
          description: Rascunho salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionMutationResult"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /inspections/{inspectionId}/complete:
    post:
      tags:
        - Inspections
      operationId: completeInspection
      summary: Conclui uma data sem afetar outras datas da semana
      security:
        - bearerAuth: []
        - webSession: []
      parameters:
        - $ref: "#/components/parameters/InspectionId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Inspeção concluída
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionMutationResult"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          description: Campos/respostas exigidos ausentes
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://api.example.com/problems/validation-failed
                title: Não foi possível concluir a inspeção
                status: 422
                code: VALIDATION_FAILED
