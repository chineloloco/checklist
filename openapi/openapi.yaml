        active:
          type: boolean
    CreateUserRequest:
      type: object
      required:
        - displayName
        - employeeNumber
        - roles
        - password
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 200
        employeeNumber:
          $ref: "#/components/schemas/EmployeeNumber"
        roles:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum:
              - ORG_ADMIN
              - TEMPLATE_MANAGER
              - FLEET_MANAGER
              - SUPERVISOR
              - INSPECTOR
              - AUDITOR
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: De 10 caracteres a 72 bytes UTF-8; o limite em bytes também é validado no servidor.
    UpdateUserRequest:
      type: object
      required:
        - displayName
        - employeeNumber
        - roles
        - active
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 200
        employeeNumber:
          $ref: "#/components/schemas/EmployeeNumber"
        roles:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum:
              - ORG_ADMIN
              - TEMPLATE_MANAGER
              - FLEET_MANAGER
              - SUPERVISOR
              - INSPECTOR
              - AUDITOR
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: De 10 caracteres a 72 bytes UTF-8; o limite em bytes também é validado no servidor.
        active:
          type: boolean
      description: >-
        PATCH exige nome, matrícula, perfis e situação. Omita password para manter a senha; não
        envie string vazia. Não permite autodesativação nem remoção do último administrador ativo.
